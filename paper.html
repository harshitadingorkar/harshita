<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2EFE7">
  <title>The Generative Power of Props — Harshita Shyale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;1,300;1,400&family=Geist+Mono:wght@400&family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ground: #F2EFE7;
      --paper: #FBF8F0;
      --ink: #302d27;
      --muted: #777166;
      --rule: rgba(48, 45, 39, .16);
      --page-width: min(42vw, 520px);
      --page-height: calc(var(--page-width) * 1.414);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--ground);
      font-family: "Instrument Sans", sans-serif;
      display: flex;
      flex-direction: column;
    }

    button, a { color: inherit; }

    .topbar {
      width: min(100% - 48px, 1160px);
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font: 11px/1.4 "Geist Mono", monospace;
      letter-spacing: .025em;
      text-transform: lowercase;
    }

    .topbar a {
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 180ms ease;
    }

    .topbar a:hover { border-color: currentColor; }

    .topbar-title {
      text-align: right;
      letter-spacing: .08em;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 0 24px 12px;
    }

    .book-stage {
      position: relative;
      width: calc(var(--page-width) * 2);
      height: var(--page-height);
      overflow: clip;
      perspective: 2200px;
      isolation: isolate;
      filter: drop-shadow(0 15px 22px rgba(61, 53, 41, .09));
    }

    .book-stage::before {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      content: "";
      background: rgba(75, 66, 54, .14);
      box-shadow: 0 0 11px 4px rgba(70, 61, 49, .055);
      pointer-events: none;
    }

    .page {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(65, 56, 43, .055);
    }

    .page-left {
      left: 0;
      box-shadow:
        inset -22px 0 28px -28px rgba(50, 43, 33, .45),
        inset 0 0 0 1px rgba(65, 56, 43, .055);
    }

    .page-right {
      right: 0;
      box-shadow:
        inset 22px 0 28px -28px rgba(50, 43, 33, .45),
        inset 0 0 0 1px rgba(65, 56, 43, .055);
    }

    .page-content {
      position: relative;
      width: 100%;
      height: 100%;
      padding: clamp(30px, 4vw, 54px);
      display: flex;
      flex-direction: column;
    }

    .page-left .page-content { padding-right: clamp(32px, 4.4vw, 58px); }
    .page-right .page-content { padding-left: clamp(32px, 4.4vw, 58px); }

    .page-leaf {
      position: absolute;
      z-index: 4;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      visibility: hidden;
      transform: rotateY(0);
      transform-origin: left center;
      transform-style: preserve-3d;
      will-change: transform;
      pointer-events: none;
    }

    .page-leaf.backward {
      right: auto;
      left: 0;
      transform-origin: right center;
    }

    .page-leaf.is-visible { visibility: visible; }

    .leaf-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: inset 0 0 0 1px rgba(65, 56, 43, .06);
    }

    .leaf-face::after {
      position: absolute;
      z-index: 5;
      inset: 0;
      content: "";
      opacity: var(--turn-shade, 0);
      pointer-events: none;
      background: linear-gradient(90deg,
        rgba(39, 32, 24, .43) 0%,
        rgba(255, 255, 255, .30) 17%,
        rgba(255, 255, 255, 0) 43%,
        rgba(42, 34, 25, .18) 100%);
      background-size: 180% 100%;
      background-position: var(--shade-position, 0%) 0;
    }

    .leaf-back { transform: rotateY(180deg); }

    .controls {
      min-height: 82px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
      padding: 10px 24px 24px;
      color: var(--muted);
      font-family: "Geist Mono", monospace;
      font-size: 11px;
      letter-spacing: .025em;
      text-transform: lowercase;
    }

    .controls button {
      min-width: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      text-transform: inherit;
    }

    .controls button:hover:not(:disabled) { text-decoration: underline; }
    .controls button:disabled { color: #aaa49a; cursor: default; }
    .page-count { min-width: 92px; text-align: center; }

    .cover-page {
      justify-content: center;
      gap: 0;
    }

    .cover-page h1 {
      max-width: 11ch;
      margin: 0;
      font: italic 400 clamp(38px, 4.2vw, 58px)/.95 "Averia Serif Libre", serif;
      letter-spacing: -.035em;
    }

    .cover-subtitle {
      max-width: 29ch;
      margin: 28px 0 0;
      color: #5e594f;
      font: 400 clamp(14px, 1.35vw, 17px)/1.5 "Instrument Sans", sans-serif;
    }

    .cover-author {
      margin-top: 46px;
      color: var(--muted);
      font: 11px/1.4 "Geist Mono", monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .epigraph-page {
      justify-content: center;
    }

    .epigraph {
      margin: 0;
      font: italic 400 clamp(25px, 2.7vw, 36px)/1.2 "Averia Serif Libre", serif;
      letter-spacing: -.015em;
    }

    .epigraph cite {
      display: block;
      margin-top: 26px;
      color: var(--muted);
      font: normal 10px/1.5 "Geist Mono", monospace;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .front-note-page {
      justify-content: flex-end;
    }

    .front-note {
      max-width: 26ch;
      margin: 0;
      color: var(--muted);
      font: 400 13px/1.7 "Instrument Sans", sans-serif;
    }

    .scene-heading {
      justify-content: space-between;
    }

    .scene-number {
      color: var(--muted);
      font: 10px/1.4 "Geist Mono", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-variant: small-caps;
    }

    .scene-title {
      margin: auto 0 25px;
      font: italic 400 clamp(36px, 4vw, 54px)/.98 "Averia Serif Libre", serif;
      letter-spacing: -.025em;
    }

    .pull-quote {
      max-width: 31ch;
      margin: 0;
      padding-top: 17px;
      border-top: 1px solid var(--rule);
      color: #595449;
      font: italic 400 clamp(17px, 1.7vw, 21px)/1.35 "Averia Serif Libre", serif;
    }

    .scene-copy {
      justify-content: center;
    }

    .scene-copy p {
      margin: 0 0 1.05em;
      font: 400 clamp(13px, 1.25vw, 16px)/1.65 "Instrument Sans", sans-serif;
      text-wrap: pretty;
    }

    .scene-copy p:last-child { margin-bottom: 0; }

    .footnote {
      color: var(--muted);
      font: 9px/1 "Geist Mono", monospace;
      vertical-align: super;
    }

    .colophon {
      justify-content: center;
      gap: 22px;
    }

    .colophon-title {
      margin: 0;
      font: italic 400 34px/1.05 "Averia Serif Libre", serif;
    }

    .colophon a {
      width: fit-content;
      color: var(--muted);
      font: 11px/1.5 "Geist Mono", monospace;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      text-transform: lowercase;
    }

    .book-stage.single {
      width: min(86vw, 520px);
      height: calc(min(86vw, 520px) * 1.414);
    }

    .book-stage.single::before,
    .book-stage.single .page-left { display: none; }

    .book-stage.single .page-right {
      right: auto;
      left: 0;
      width: 100%;
      box-shadow: inset 0 0 0 1px rgba(65, 56, 43, .055);
    }

    .book-stage.single .page-content {
      padding: clamp(26px, 7vw, 42px);
    }

    .book-stage.single .page-leaf {
      width: 100%;
      transform-origin: left center;
    }

    .book-stage.single .page-leaf.backward { transform-origin: right center; }

    .book-stage.single .cover-page h1 { font-size: clamp(40px, 11vw, 52px); }
    .book-stage.single .cover-subtitle { font-size: 14px; }
    .book-stage.single .scene-title { font-size: clamp(38px, 11vw, 50px); }
    .book-stage.single .scene-copy p { font-size: 13px; line-height: 1.45; }

    @media (max-width: 760px) {
      :root {
        --page-width: min(86vw, 520px);
        --page-height: calc(var(--page-width) * 1.414);
      }

      .topbar {
        width: calc(100% - 32px);
        min-height: 54px;
        font-size: 9px;
      }

      .topbar-title { max-width: 42%; }

      main { padding: 2px 0 12px; }

      .controls {
        min-height: 68px;
        gap: 22px;
        padding-top: 6px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }

      .page-leaf { display: none !important; }

      .book-stage.is-crossfading .page {
        animation: paper-crossfade 240ms ease both;
      }

      @keyframes paper-crossfade {
        from { opacity: .35; }
        to { opacity: 1; }
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html">back to the map</a>
    <span class="topbar-title">The Generative Power of Props</span>
  </header>
  <main>
    <div class="book-stage" id="book" aria-label="The Generative Power of Props, page-flip reader">
      <section class="page page-left" id="page-left" aria-label="Left page">
        <div class="page-content" id="content-left"></div>
      </section>
      <section class="page page-right" id="page-right" aria-label="Right page">
        <div class="page-content" id="content-right"></div>
      </section>
      <div class="page-leaf" id="page-leaf" aria-hidden="true">
        <div class="leaf-face leaf-front"><div class="page-content" id="leaf-front"></div></div>
        <div class="leaf-face leaf-back"><div class="page-content" id="leaf-back"></div></div>
      </div>
    </div>
  </main>
  <nav class="controls" aria-label="Paper pages">
    <button type="button" id="prev" aria-label="Previous page">prev</button>
    <span class="page-count" id="page-count" aria-live="polite"></span>
    <button type="button" id="next" aria-label="Next page">next</button>
  </nav>
  <script src="paper-reader.js"></script>
</body>
</html>
