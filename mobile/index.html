<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brass and Glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A hanging mobile of brass, oak and blown glass that sways with your phone, turns over when you hover it, and rings when its pieces touch.">
<style>
/* Layout: one full-bleed meadow, drawn in WebGL as Gaussian splats. Two small controls sit in the bottom-right corner and fade when you are not using them. One look only: a sunny day. */
:root{
  --grass:#C9D8D0; --ink:#2B3150; --ink3:rgba(43,49,80,.35); --hair:rgba(43,49,80,.16);
  --chip:rgba(250,249,236,.78); --pink:#E58FA6; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--grass);color:var(--ink);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas#room{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas#room.grab{cursor:grab}
canvas#room.grabbing{cursor:grabbing}
.controls{position:fixed;z-index:2;display:flex;gap:8px;
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  transition:opacity .8s ease}
.controls.idle{opacity:.22}
.controls button{width:40px;height:40px;display:grid;place-items:center;padding:0;color:var(--ink);background:var(--chip);
  border:1px solid var(--hair);border-radius:50%;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .2s}
.controls button:hover{border-color:var(--ink3)}
.controls button:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.controls svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.controls .w{transition:opacity .3s,stroke .3s;opacity:.25}
.controls .w.on{opacity:1;stroke:var(--pink)}
#b-sound .wave{opacity:0;transition:opacity .3s}
#b-sound.on .wave{opacity:1;stroke:var(--pink)}
#b-sound .x{transition:opacity .3s}
#b-sound.on .x{opacity:0}
@media (prefers-reduced-motion: reduce){.controls{transition:none}}
</style>
</head>
<body>
<canvas id="room" role="img" aria-label="A hanging mobile of brass, oak and glass. Tilt your device, or move the pointer, to sway it. Tap a piece to ring it; drag to swing it."></canvas>

<div class="controls" id="controls">
  <button id="b-air" type="button" aria-label="Air in the room: draft. Change it.">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path class="w" d="M3 6.5c2.2-1.6 4.4 1.6 6.6 0s4.4 1.6 6.6 0"/><path class="w" d="M3 10.5c2.2-1.6 4.4 1.6 6.6 0s4.4 1.6 6.6 0"/><path class="w" d="M3 14.5c2.2-1.6 4.4 1.6 6.6 0s4.4 1.6 6.6 0"/></svg>
  </button>
  <button id="b-sound" type="button" aria-label="Turn sound on" aria-pressed="false">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 8v4h3l4 3.2V4.8l-4 3.2z"/><path class="wave" d="M13.2 7.6a3.4 3.4 0 0 1 0 4.8"/><path class="wave" d="M15.3 5.6a6.2 6.2 0 0 1 0 8.8"/><path class="x" d="M13.5 8.2l3.6 3.6M17.1 8.2l-3.6 3.6"/></svg>
  </button>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

/* ───────────── Noise: smooth 3D value noise for the air currents ───────────── */
function hash(i, j, k) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1440662683)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const sm = t => t * t * (3 - 2 * t);
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const u = sm(x - xi), v = sm(y - yi), w = sm(z - zi);
  const c = (a, b, d) => hash(xi + a, yi + b, zi + d);
  return lerp(
    lerp(lerp(c(0,0,0), c(1,0,0), u), lerp(c(0,1,0), c(1,1,0), u), v),
    lerp(lerp(c(0,0,1), c(1,0,1), u), lerp(c(0,1,1), c(1,1,1), u), v), w) * 2 - 1;
}

/* ───────────── The sculpture ─────────────
   World units are metres (x right, y down, z away from you toward the wall); masses are grams.
   rod(length, string drop, [left, right], bias, rest turn). The hook on every rod is solved from
   the masses below it, so the mobile balances. bias tips a rod a little, as hand-bent mobiles do,
   and the rest turn is the angle its string's twist settles it at, so the mobile has depth at rest. */
const rod = (len, drop, kids, bias = 0, turn = 0) => ({ type: 'rod', len, drop, kids, bias, turn, g: len * 9 });
const piece = (kind, o) => Object.assign({ type: 'piece', kind, drop: .026, face: 0 }, o);

const TREE = rod(.50, .16, [
  rod(.30, .09, [
    piece('brass', { r: .074, g: 64, name: 'Hammered brass', note: 0, face: .35, drop: .03 }),
    rod(.27, .12, [
      piece('glass', { r: .052, g: 15, name: 'Pink glass, frosted', c1: [242, 168, 186], c2: [252, 236, 240], rim: [196, 104, 132], note: 3, face: -.5 }),
      rod(.19, .15, [
        piece('tear', { w: .026, h: .085, g: 9, name: 'Lilac teardrop, blown', c1: [200, 178, 234], c2: [244, 238, 252], rim: [128, 100, 182], note: 6 }),
        piece('glass', { r: .029, g: 4, name: 'Amber glass', c1: [246, 206, 120], c2: [252, 240, 206], rim: [190, 132, 50], note: 8, face: .7 })
      ], .02, .55)
    ], -.03, -.4)
  ], .01, .3),
  rod(.33, .17, [
    rod(.25, .10, [
      piece('sphere', { r: .046, g: 22, name: 'Ribbed globe, blown', c1: [196, 222, 244], c2: [240, 246, 252], rim: [96, 132, 182], note: 2, drop: .035 }),
      rod(.19, .16, [
        piece('film', { rx: .05, ry: .032, g: 3, name: 'Dichroic film', note: 7, face: -.8 }),
        piece('crystal', { w: .028, h: .096, g: 12, name: 'Cut crystal pendalogue', note: 9 })
      ], -.02, -.5)
    ], .02, .45),
    rod(.20, .05, [
      piece('brass', { r: .042, g: 21, name: 'Small brass', note: 4, face: -.3 }),
      piece('oak', { w: .036, h: .118, g: 24, name: 'White oak paddle', note: 1, face: .5, drop: .03 })
    ], -.025, -.35)
  ], -.02, -.25)
], 0, .12);

/* ───────────── Physics: Verlet particles + distance constraints, in 3D ─────────────
   Each rod is a rigid triangle (left tip, right tip, the hook loop just above) hung by a string
   from its parent's tip, so it can tip, swing and turn on its string all at once. Each piece is a
   two-particle pendulum (its drilled hole and its centre of mass), plus a turn about its own
   string, which is what makes flat brass and glass flash as they face the light. */
const P = [], C = [], RODS = [], PIECES = [];
let DROPK = 1;   // on a tall screen the strings get longer, so the mobile hangs as a taller cascade
const part = (x, y, z, g, area = 0) => { const p = { x, y, z, px: x, py: y, pz: z, m: g, im: g > 0 ? 1 / g : 0, area, resist: 1, still: 0, wx: 0, wy: 0, wz: 0 }; P.push(p); return p; };
const link = (a, b) => C.push({ a, b, len: Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z) });

function massOf(n) {
  if (n.type === 'piece') return n.g;
  n.M = n.g + massOf(n.kids[0]) + massOf(n.kids[1]);
  return n.M;
}
const mass = n => n.type === 'piece' ? n.g : n.M;
function pieceGeom(n) {
  // hole: distance from the hole to the centre of mass; area: the face that catches air; rc: reach
  switch (n.kind) {
    case 'brass': case 'glass': return { hole: n.r * .82, area: Math.PI * n.r * n.r, rc: n.r };
    case 'film': return { hole: n.ry * .8, area: Math.PI * n.rx * n.ry, rc: Math.max(n.rx, n.ry) * .9 };
    case 'sphere': return { hole: n.r + .01, area: Math.PI * n.r * n.r, rc: n.r };
    case 'tear': return { hole: n.h * .55, area: n.w * n.h * 1.4, rc: n.w * 1.1 };
    case 'crystal': return { hole: n.h * .55, area: n.w * n.h * .9, rc: n.w * 1.2 };
    case 'oak': return { hole: n.h * .44, area: n.w * n.h * 1.6, rc: n.w * 1.15 };
  }
}
function build(n, a) {
  if (n.type === 'piece') {
    Object.assign(n, pieceGeom(n));
    n.S = part(a.x, a.y + n.drop * (DROPK > 1 ? 1.3 : 1), a.z, n.g * .08);
    n.Cp = part(a.x, n.S.y + n.hole, a.z, n.g * .92, n.area);
    link(a, n.S); link(n.S, n.Cp);
    n.yaw = n.face; n.yw = 0; n.hue = 200; n.hover = 0; n.lastRing = -1; n.flash = 0; n.sparkle = 0;
    n.flutter = clamp(n.area / n.g * 1100, .35, 3.2);
    n.id = PIECES.length; PIECES.push(n);
    return;
  }
  const ML = mass(n.kids[0]), MR = mass(n.kids[1]);
  const f = clamp((n.g / 2 + MR) / (n.g + ML + MR) + n.bias, .08, .92);
  const hk = n.len * .07, c = Math.cos(n.turn), s = Math.sin(n.turn);
  const hx = a ? a.x : 0, hy = (a ? a.y : 0) + n.drop * DROPK, hz = a ? a.z : 0;
  n.H = part(hx, hy, hz, n.g * .1, .0004);
  n.L = part(hx - f * n.len * c, hy + hk, hz - f * n.len * s, n.g * .45, .0008);
  n.R = part(hx + (1 - f) * n.len * c, hy + hk, hz + (1 - f) * n.len * s, n.g * .45, .0008);
  n.f = f; n.rL = f * n.len; n.rR = (1 - f) * n.len;
  link(a || ANCHOR, n.H);
  link(n.L, n.R); link(n.H, n.L); link(n.H, n.R);
  RODS.push(n);
  build(n.kids[0], n.L);
  build(n.kids[1], n.R);
}
massOf(TREE);
let ANCHOR;
const outer = [];   // strings and links, the lines drawn between the parts
function assemble(tall) {
  DROPK = tall ? 1.85 : 1;
  P.length = 0; C.length = 0; RODS.length = 0; PIECES.length = 0; outer.length = 0;
  ANCHOR = part(0, 0, 0, 0);
  build(TREE, null);
  const inner = new Set();
  for (const r of RODS) for (const cn of C) if ((cn.a === r.L && cn.b === r.R) || (cn.a === r.H && (cn.b === r.L || cn.b === r.R))) inner.add(cn);
  for (const n of PIECES) for (const cn of C) if (cn.a === n.S && cn.b === n.Cp) inner.add(cn);
  for (const cn of C) if (!inner.has(cn)) outer.push(cn);
}

/* environment */
const G = 3.1;                  // gravity, slowed so a 30 cm rod sways over a couple of seconds
const AIR = 1900, BASE = .12;   // air drag per unit of face area, and a little drag on everything
const TWIST = .9;               // how firmly a rod's string turns it back to its rest angle
const env = {
  tilt: 0, tiltTarget: 0, lean: 0, leanTarget: 0,  // sensor gravity, smoothed
  ix: 0, iy: 0, iz: 0,          // inertial push from moving the phone
  spinKick: 0,                  // change in the body's turning speed this frame
  air: 1, airLevels: [['still', .015], ['draft', .1], ['breeze', .24], ['gusts', .5]],
  airNow: .1, t: 0, gust: 1,
  pointer: { x: 0, y: 0, sx: 0, sy: 0, vx: 0, vy: 0, inside: false, type: 'mouse', down: false },
};
try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) env.air = 0; } catch (e) {}

function windAt(x, y, z, out) {
  const t = env.t, lvl = env.airNow;
  const base = .55 + .45 * noise3(t * .045, 3.1, 0);          // slow drift of the whole room
  const g = .55 + .9 * Math.max(0, noise3(t * .11, 7.7, 2));   // gusts come and go
  env.gust = g;
  const n1 = noise3(x * 2.2 + t * .25, y * 2.2, z * 2.2 + t * .18);
  const n2 = noise3(x * 2.2 + 40, y * 2.2 - t * .2, z * 2.2 + t * .18 + 9);
  const n3 = noise3(x * 2.2 - 17, y * 2.2 + 5, z * 2.2 + t * .22 + 31);
  // the same travelling waves the grass bends to, so a gust crosses the meadow and then reaches the mobile
  const X = x, Z = -z, wave = .55 * Math.sin(X * 1.3 - t * 1.7 + Math.sin(Z * .8 + t * .3) * 1.5) + .3 * Math.sin(X * 2.9 + Z * 1.7 - t * 2.6) + .15 * Math.sin(X * 5.3 - Z * 3.1 - t * 3.9);
  out.x = lvl * g * (.65 + .55 * wave + n1 * .3);
  out.y = lvl * g * n2 * .35;
  out.z = lvl * g * (n3 * .9 + base * .2);
  const p = env.pointer;                                       // a hand moving through the air
  if (p.inside) {
    const dx = x - p.x, dy = y - p.y, d2 = dx * dx + dy * dy, R = .16;
    if (d2 < R * R) { const f = (1 - Math.sqrt(d2) / R) ** 2 * (p.down ? 1.1 : .55); out.x += p.vx * f; out.y += p.vy * f; out.z += Math.hypot(p.vx, p.vy) * f * .4; }
  }
  return out;
}

const SUB = 10, ITER = 2;
const tmp = { x: 0, y: 0, z: 0 };
let grabbed = null, grabT = null;
function step(dt) {
  env.t += dt;
  env.airNow = lerp(env.airNow, env.airLevels[env.air][1], .02);
  const ct = Math.cos(env.tilt), st = Math.sin(env.tilt), cl = Math.cos(env.lean), sl = Math.sin(env.lean);
  const gx = st * cl * G, gy = ct * cl * G, gz = sl * G;
  for (const p of P) if (p.area) { windAt(p.x, p.y, p.z, tmp); p.wx = tmp.x * (1 - p.still); p.wy = tmp.y * (1 - p.still); p.wz = tmp.z * (1 - p.still); }
  const h = dt / SUB, h2 = h * h;
  // turning your body: the rods and pieces keep still in the room, so in the phone they turn the other way
  if (env.spinKick) {
    const dw = -env.spinKick;
    for (const r of RODS) for (const p of [r.L, r.R]) { const rx = p.x - r.H.x, rz = p.z - r.H.z; p.px -= -dw * rz * h; p.pz -= dw * rx * h; }
    for (const n of PIECES) n.yw += dw;
    env.spinKick = 0;
  }
  for (let s = 0; s < SUB; s++) {
    for (const p of P) {
      if (!p.im) continue;
      const vx = (p.x - p.px) / h, vy = (p.y - p.py) / h, vz = (p.z - p.pz) / h;
      const k = (AIR * p.area * p.resist) / p.m + BASE;
      const ax = gx + env.ix + k * (p.wx - vx), ay = gy + env.iy + k * (p.wy - vy), az = gz + env.iz + k * (p.wz - vz);
      p.px = p.x; p.py = p.y; p.pz = p.z;
      p.x += vx * h + ax * h2; p.y += vy * h + ay * h2; p.z += vz * h + az * h2;
    }
    // each rod's string twists it gently back toward its rest angle
    for (const r of RODS) {
      const phi = Math.atan2(r.R.z - r.L.z, r.R.x - r.L.x), err = wrap(phi - r.turn);
      const px = -Math.sin(phi), pz = Math.cos(phi), a = -TWIST * err * h2;
      r.R.x += px * a * r.rR; r.R.z += pz * a * r.rR; r.L.x -= px * a * r.rL; r.L.z -= pz * a * r.rL;
    }
    if (grabbed) { const q = grabbed.Cp; q.x += (grabT.x - q.x) * .18; q.y += (grabT.y - q.y) * .18; }
    for (let it = 0; it < ITER; it++) {
      for (const c of C) {
        const a = c.a, b = c.b, dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz) || 1e-9;
        const w = a.im + b.im; if (!w) continue;
        const k = (d - c.len) / (d * w);
        a.x += dx * k * a.im; a.y += dy * k * a.im; a.z += dz * k * a.im;
        b.x -= dx * k * b.im; b.y -= dy * k * b.im; b.z -= dz * k * b.im;
      }
    }
    if (s % 2 === 0) collide(h * 2);
    // the wall behind, and the glass of the phone in front: nothing passes through either
    for (const p of P) { if (p.z > WALL - .01) p.z = WALL - .01; else if (p.z < -.6) p.z = -.6; }
    if (s === SUB - 1) for (const n of PIECES) {
      const lim = WALL - n.rc * .35;
      if (n.Cp.z > lim) { const v = (n.Cp.z - n.Cp.pz) / h; n.Cp.z = lim; n.Cp.pz = lim + (n.Cp.z - n.Cp.pz) * .3; if (v > .08) ring(n, v * .5); }
    }
  }
  // each piece turns on its own string
  for (const n of PIECES) {
    const vx = (n.Cp.x - n.Cp.px) / h, vz = (n.Cp.z - n.Cp.pz) / h;
    const air = Math.hypot(n.Cp.wx, n.Cp.wz);
    const nz = noise3(n.id * 13.7, env.t * .35, 4.2);
    const acc = -1.1 * Math.sin(2 * (n.yaw - n.face))   // the string's twist settles it back, face-on or face-back
      - 1.5 * n.yw                                      // the air resists turning
      + nz * air * n.flutter * 22                       // eddies catch one edge more than the other
      + (vx * Math.cos(n.yaw) + vz * Math.sin(n.yaw)) * n.flutter * .9;  // swinging into the air makes a flat piece twist
    n.yw += acc * dt; n.yaw += n.yw * dt;
    n.flash *= .9;
  }
}

/* Pieces touch: a soft push apart, and a note if they meet hard enough */
function collide(h) {
  for (let i = 0; i < PIECES.length; i++) for (let j = i + 1; j < PIECES.length; j++) {
    const A = PIECES[i], B = PIECES[j], a = A.Cp, b = B.Cp;
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz), min = (A.rc + B.rc) * .8;
    if (d >= min || d < 1e-6) continue;
    const nx = dx / d, ny = dy / d, nz = dz / d, over = min - d, w = a.im + b.im;
    const rv = ((b.x - b.px) - (a.x - a.px)) * nx + ((b.y - b.py) - (a.y - a.py)) * ny + ((b.z - b.pz) - (a.z - a.pz)) * nz;
    a.x -= nx * over * a.im / w; a.y -= ny * over * a.im / w; a.z -= nz * over * a.im / w;
    b.x += nx * over * b.im / w; b.y += ny * over * b.im / w; b.z += nz * over * b.im / w;
    const speed = -rv / (h / 2);
    if (speed > .05) { ring(A, speed); ring(B, speed); }
  }
}

/* ───────────── Sound ───────────── */
const Sound = (() => {
  let ctx = null, out = null, send = null, airGain = null, airBand = null, on = false, voices = 0;
  const PENTA = [0, 2, 4, 7, 9];
  const freq = i => 146.83 * Math.pow(2, (Math.floor(i / 5) * 12 + PENTA[i % 5]) / 12); // D pentatonic
  const TIMBRE = {
    brass:   { mul: 2, parts: [[1, 1, 4.2], [1.004, .7, 4], [2.756, .45, 2], [5.404, .2, 1], [8.93, .1, .5]] },
    glass:   { mul: 4, parts: [[1, 1, 2.2], [2.71, .4, 1], [5.15, .18, .45], [8.4, .08, .25]] },
    sphere:  { mul: 4, parts: [[1, 1, 2.6], [2.32, .5, 1.3], [4.25, .2, .6], [6.63, .1, .3]] },
    tear:    { mul: 4, parts: [[1, 1, 2], [2.32, .45, 1], [4.25, .2, .5]] },
    film:    { mul: 2, parts: [[1, .7, .25], [3.1, .3, .12]] },
    crystal: { mul: 8, parts: [[1, 1, 1.8], [2.32, .5, 1], [4.25, .3, .5], [6.63, .15, .3], [9.4, .08, .2]] },
    oak:     { mul: 1, parts: [[1, 1, .2], [2.6, .45, .09], [4.1, .2, .05]], knock: true },
  };
  function impulse(sec) {
    const n = ctx.sampleRate * sec, b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
    return b;
  }
  function init() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    const master = ctx.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(ctx.destination);
    out = ctx.createGain(); out.connect(master);
    const verb = ctx.createConvolver(); verb.buffer = impulse(3);
    send = ctx.createGain(); send.gain.value = .38; send.connect(verb);
    const wet = ctx.createGain(); wet.gain.value = .5; verb.connect(wet); wet.connect(master);

    case 'glass': return { mat: n.r > .04 ? 6 : 1, base: c, deep: rim };
    case 'sphere': return { mat: 7, base: c, deep: rim };
    case 'tear': return { mat: 1, base: c, deep: rim };
    case 'crystal': return { mat: 3, base: [.97, .98, 1], deep: [.75, .78, .85] };
    case 'film': return { mat: 4, base: [1, 1, 1], deep: [.6, .55, .7] };
  }
}
function buildMobile() {
  for (const n of PIECES) { n.mesh = meshVAO(geometryFor(n)); n.mtl = materialFor(n); }
  const total = PIECES.length * 3;
  mobData = new Float32Array(total * STRIDE); mobSorted = new Float32Array(total * STRIDE);
  mobKey = new Float32Array(total); mobIdx = new Uint32Array(total);
}

function pieceFrame(n) {
  // down: from the hole to the centre; right and face turn about it with the piece's yaw
  const S = toG(n.S.x, n.S.y, n.S.z), Cc = toG(n.Cp.x, n.Cp.y, n.Cp.z), down = norm(sub(Cc, S));
  const r0 = norm(sub([1, 0, 0], mul(down, down[0]))), f0 = cross(r0, down);
  const cy = Math.cos(n.yaw), sy = Math.sin(n.yaw);
  return { C: Cc, S, down, right: add(mul(r0, cy), mul(f0, sy)), face: add(mul(f0, cy), mul(r0, -sy)) };
}
let mobN = 0;
function writeSplat(arr, i, c, a1, a2, a3, col, alpha) {
  const o = i * STRIDE;
  arr[o] = c[0]; arr[o + 1] = c[1]; arr[o + 2] = c[2];
  arr[o + 3] = a1[0]; arr[o + 4] = a1[1]; arr[o + 5] = a1[2];
  arr[o + 6] = a2[0]; arr[o + 7] = a2[1]; arr[o + 8] = a2[2];
  arr[o + 9] = a3[0]; arr[o + 10] = a3[1]; arr[o + 11] = a3[2];
  arr[o + 12] = col[0]; arr[o + 13] = col[1]; arr[o + 14] = col[2]; arr[o + 15] = alpha;
  arr[o + 16] = 0; arr[o + 17] = 0; arr[o + 18] = 2; arr[o + 19] = 0;
}

/* ---------- the wire, rebuilt every frame from the physics ---------- */
const STEEL = .0009, NYLON = .0003;
function seg(a, b, r, kind = 0) { if (wireN >= 4000) return; const o = wireN++ * 8; wireData.set(a, o); wireData.set(b, o + 3); wireData[o + 6] = r; wireData[o + 7] = kind; }
function poly(pts, r, kind = 0) { for (let i = 1; i < pts.length; i++) seg(pts[i - 1], pts[i], r, kind); }
// a small loop of wire: centre c, in the plane of axes a and b
function loop(c, a, b, rad, r = STEEL, from = 0, to = TAU, n = 12) {
  const pts = []; for (let i = 0; i <= n; i++) { const t = from + (to - from) * i / n; pts.push(add(c, add(mul(a, Math.cos(t) * rad), mul(b, Math.sin(t) * rad)))); }
  poly(pts, r);
}
let BEADPOS = [];
function updateWire() {
  wireN = 0; BEADPOS = [];
  const X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];
  for (const r of RODS) {
    const L = toG(r.L.x, r.L.y, r.L.z), R2 = toG(r.R.x, r.R.y, r.R.z), Hh = toG(r.H.x, r.H.y, r.H.z);
    const along = norm(sub(R2, L)), up = norm(cross(cross(along, Y), along)), toward = norm(cross(along, up));
    // the rod: one wire, bent through its hook, with a little loop formed at the top where it hangs
    const ctrl = sub(mul(Hh, 2), mul(add(L, R2), .5)), pts = [];
    for (let i = 0; i <= 28; i++) { const t = i / 28, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t; pts.push(add(add(mul(L, a), mul(ctrl, b)), mul(R2, c))); }
    poly(pts, STEEL);
    loop(add(Hh, mul(up, .0042)), up, toward, .0042, STEEL * .9);
    // each end turned down and round into a closed eye
    for (const [tip, dir] of [[L, -1], [R2, 1]]) {
      const out = mul(along, dir);
      loop(add(tip, mul(up, -.004)), out, up, .004, STEEL * .9, Math.PI * .5, Math.PI * 2.5, 14);
    }
  }
  for (const cn of outer) {
    const b = toG(cn.b.x, cn.b.y, cn.b.z);
    if (cn.a === ANCHOR) { seg(add(b, [0, 3, 0]), add(b, [0, .006, 0]), NYLON, 1); continue; }   // the hanging line: clear nylon
    const a = add(toG(cn.a.x, cn.a.y, cn.a.z), [0, -.008, 0]);
    const piece = PIECES.find(p => p.S === cn.b);
    const end = piece ? b : add(b, [0, .0084, 0]);
    // an S-hook: down from the eye, with a small glass bead threaded on it
    const d = sub(end, a), len = Math.hypot(...d);
    if (len < .003) continue;
    const dir = mul(d, 1 / len), side = norm(cross(dir, Z));
    loop(add(a, mul(dir, .0035)), dir, side, .0035, STEEL * .85, Math.PI, TAU * 1.5, 10);
    seg(add(a, mul(dir, .007)), sub(end, mul(dir, .003)), STEEL * .85);
    BEADPOS.push(add(a, mul(d, .45)));
    if (piece) {    // a ring of wire through the drilled hole
      const F = piece.F, hc = add(F.C, mul(F.down, -piece.hole));
      loop(hc, F.down, F.face, .0045, STEEL * .8, 0, TAU, 16);
    }
  }
}
function updateMobile() {
  mobN = 0;
  for (const n of PIECES) n.F = pieceFrame(n);
  // a soft blue shadow lying on the grass under each piece, along the sun's rays
  for (const n of PIECES) {
    const F = n.F, g = toGround(F.C), ru = dirGround(F.right), dv = dirGround(F.down), r = n.rc;
    const wgt = GLASS[n.kind] ? .55 : 1, soft = 1 + F.C[1] * .35;
    for (const [k, a] of [[.7, .22], [1.1, .14], [1.6, .08]]) {
      writeSplat(mobData, mobN++, [g[0], .16, g[1]], [ru[0] * r * k * soft, 0, ru[1] * r * k * soft], [dv[0] * r * k * soft, 0, dv[1] * r * k * soft], [0, .004, 0], [.2, .27, .5], a * wgt);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, mobileBuf); gl.bufferData(gl.ARRAY_BUFFER, mobData.subarray(0, mobN * STRIDE), gl.DYNAMIC_DRAW);
  updateWire();
  for (const n of PIECES) { const [x, y, d] = toScreen(n.F.C); n.X = x; n.Y = y; n.R = n.rc * cam.fy / d; }
}

/* ---------- the shadow on the grass: each piece pressed flat along the sun's rays ---------- */
const SH = { size: 512, x0: -4, z0: -10, w: 9, h: 11 };
const shc = document.createElement('canvas'); shc.width = shc.height = SH.size;
const shx = shc.getContext('2d');
const toGround = p => { const k = p[1] / SUN[1]; return [p[0] - SUN[0] * k, p[2] - SUN[2] * k]; };
const dirGround = d => { const k = d[1] / SUN[1]; return [d[0] - SUN[0] * k, d[2] - SUN[2] * k]; };
function drawShadowMap() {
  const s = SH.size / SH.w, sz = SH.size / SH.h, X = x => (x - SH.x0) * s, Z = z => (z - SH.z0) * sz;
  shx.setTransform(1, 0, 0, 1, 0, 0); shx.fillStyle = '#000'; shx.fillRect(0, 0, SH.size, SH.size);
  try { shx.filter = 'blur(1.6px)'; } catch (e) {}
  shx.strokeStyle = 'rgba(255,255,255,.55)'; shx.lineWidth = 1.1; shx.beginPath();
  for (const r of RODS) { const a = toGround(toG(r.L.x, r.L.y, r.L.z)), m = toGround(toG(r.H.x, r.H.y, r.H.z)), b = toGround(toG(r.R.x, r.R.y, r.R.z)); shx.moveTo(X(a[0]), Z(a[1])); shx.quadraticCurveTo(X(2 * m[0] - (a[0] + b[0]) / 2), Z(2 * m[1] - (a[1] + b[1]) / 2), X(b[0]), Z(b[1])); }
  for (const cn of outer) { if (cn.a === ANCHOR) continue; const a = toGround(toG(cn.a.x, cn.a.y, cn.a.z)), b = toGround(toG(cn.b.x, cn.b.y, cn.b.z)); shx.moveTo(X(a[0]), Z(a[1])); shx.lineTo(X(b[0]), Z(b[1])); }
  shx.stroke();
  for (const n of PIECES) {
    const F = n.F, g = toGround(F.C), ru = dirGround(F.right), dv = dirGround(F.down);
    shx.setTransform(ru[0] * s, ru[1] * sz, dv[0] * s, dv[1] * sz, X(g[0]), Z(g[1]));
    shx.fillStyle = `rgba(255,255,255,${GLASS[n.kind] ? (n.kind === 'crystal' ? .3 : .5) : .95})`;
    shx.beginPath(); outline(shx, n); shx.fill();
  }
  shx.setTransform(1, 0, 0, 1, 0, 0); try { shx.filter = 'none'; } catch (e) {}
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, shc);
}

/* ---------- each frame ---------- */
let frameDt = 1 / 60, ptrG = [0, 0, 0, 0];
function resize() {
  DPR = Math.min(devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 1.5 : 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  placeCamera(); buildMeadow(); buildMobile(); sceneTarget();
}
function modelOf(F) {
  const r = F.right, d = F.down, f = F.face, c = F.C;
  return new Float32Array([r[0], r[1], r[2], 0, d[0], d[1], d[2], 0, f[0], f[1], f[2], 0, c[0], c[1], c[2], 1]);
}
function render() {
  updateMobile(); drawShadowMap();
  // 1. the meadow, into a texture the glass can look through
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.useProgram(skyProg);
  const hz = toScreen([0, 0, -200])[1];
  gl.uniform3fv(SU.top, PAL.skyTop); gl.uniform3fv(SU.low, PAL.skyLow); gl.uniform1f(SU.horizon, 1 - 2 * hz / H);
  gl.bindVertexArray(skyVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.view, false, cam.view); gl.uniformMatrix4fv(U.proj, false, cam.proj);
  gl.uniform2f(U.vp, W, H); gl.uniform1f(U.focal, cam.fy);
  gl.uniform1f(U.t, env.t); gl.uniform1f(U.lvl, env.airNow); gl.uniform1f(U.gust, env.gust);
  gl.uniform4fv(U.ptr, ptrG);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shadowTex); gl.uniform1i(U.shadow, 0);
  gl.uniform4f(U.shRect, SH.x0, SH.z0, 1 / SH.w, 1 / SH.h);
  gl.uniform3fv(U.fogCol, PAL.fog); gl.uniform3f(U.shadeCol, .4, .52, .88);
  gl.bindVertexArray(meadowVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, meadowCount);
  gl.bindVertexArray(mobileVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, mobN);
  // 2. onto the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.disable(gl.BLEND);
  gl.useProgram(blitProg); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(BU.tex, 0);
  gl.bindVertexArray(skyVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // 3. the pieces, solid, each in its material
  gl.clear(gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.useProgram(meshProg);
  gl.uniformMatrix4fv(MU.view, false, cam.view); gl.uniformMatrix4fv(MU.proj, false, cam.proj);
  gl.uniform3fv(MU.eye, cam.pos); gl.uniform3fv(MU.sun, SUN); gl.uniform3fv(MU.skyTop, PAL.skyTop); gl.uniform3fv(MU.skyLow, PAL.skyLow);
  gl.uniform2f(MU.vp, cv.width, cv.height); gl.uniform1i(MU.scene, 0);
  for (const n of PIECES) {
    const m = n.mtl;
    gl.uniformMatrix4fv(MU.model, false, modelOf(n.F));
    gl.uniform1i(MU.mat, m.mat); gl.uniform3fv(MU.base, m.base); gl.uniform3fv(MU.deep, m.deep);
    const flat = n.kind === 'brass' || n.kind === 'glass' || n.kind === 'film' || n.kind === 'oak';
    gl.uniform3f(MU.hole, 0, -n.hole, flat ? .0026 : 0);
    gl.bindVertexArray(n.mesh.vao); gl.drawArrays(gl.TRIANGLES, 0, n.mesh.count);
    if (n.kind === 'sphere') {      // the blown globe's metal cap
      const F = n.F, cap = { C: add(F.C, mul(F.down, -n.r * .96)), right: F.right, down: F.down, face: F.face };
      gl.uniformMatrix4fv(MU.model, false, modelOf(cap)); gl.uniform1i(MU.mat, 0); gl.uniform3f(MU.base, .78, .74, .7); gl.uniform3f(MU.hole, 0, 0, 0);
      const c = meshes.get('cap'); gl.bindVertexArray(c.vao); gl.drawArrays(gl.TRIANGLES, 0, c.count);
    }
  }
  // beads threaded on the links
  const bead = meshes.get('bead');
  gl.uniform1i(MU.mat, 5); gl.uniform3f(MU.hole, 0, 0, 0); gl.uniform3f(MU.deep, .55, .6, .62);
  BEADPOS.forEach((p, i) => {
    gl.uniformMatrix4fv(MU.model, false, modelOf({ C: p, right: [1, 0, 0], down: [0, -1, 0], face: [0, 0, 1] }));
    gl.uniform3fv(MU.base, BEADS[i % BEADS.length]);
    gl.bindVertexArray(bead.vao); gl.drawArrays(gl.TRIANGLES, 0, bead.count);
  });
  // 4. the wire, over and around them
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  gl.useProgram(wireProg);
  gl.uniformMatrix4fv(WU.view, false, cam.view); gl.uniformMatrix4fv(WU.proj, false, cam.proj);
  gl.uniform2f(WU.vp, W, H); gl.uniform3fv(WU.eye, cam.pos); gl.uniform3fv(WU.sun, SUN); gl.uniform3fv(WU.skyTop, PAL.skyTop); gl.uniform3fv(WU.skyLow, PAL.skyLow);
  gl.bindBuffer(gl.ARRAY_BUFFER, wireBuf); gl.bufferData(gl.ARRAY_BUFFER, wireData.subarray(0, wireN * 8), gl.DYNAMIC_DRAW);
  gl.bindVertexArray(wireVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, wireN);
  gl.depthMask(true); gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.bindVertexArray(null);
}

/* ───────────── Pointer: tilt, hover, tap and drag ───────────── */
let hovered = null, downAt = null, lastPT = 0;
function pick(sx, sy, pad) {
  let best = null, bd = Infinity;
  for (const n of PIECES) { if (n.X == null) continue; const d = Math.hypot(sx - n.X, sy - n.Y); if (d < n.R + pad && d < bd - 4) { bd = d; best = n; } }
  return best;
}
function hitPlaneZ(sx, sy, zG) {        // where the pointer's ray crosses an upright plane at depth zG (world)
  const d = rayAt(sx, sy), t = (zG - cam.pos[2]) / d[2];
  return [cam.pos[0] + d[0] * t, cam.pos[1] + d[1] * t];
}
function grabTarget(n) { const [x, y] = hitPlaneZ(env.pointer.sx, env.pointer.sy, -n.Cp.z); return { x, y: TOP - y }; }
let lastG = null;
function onMove(e) {
  const p = env.pointer, now = performance.now();
  const [gx, gy] = hitPlaneZ(e.clientX, e.clientY, 0), wx = gx, wy = TOP - gy;
  const dt = Math.max(8, now - lastPT) / 1000;
  if (lastPT && p.inside) { p.vx = lerp(p.vx, clamp((wx - p.x) / dt, -3, 3), .5); p.vy = lerp(p.vy, clamp((wy - p.y) / dt, -3, 3), .5); }
  p.x = wx; p.y = wy; p.sx = e.clientX; p.sy = e.clientY; p.inside = true; p.type = e.pointerType; lastPT = now;
  // and where it skims the grass, so a quick sweep parts the meadow
  const d = rayAt(e.clientX, e.clientY);
  if (d[1] < -.01) {
    const t = -(cam.pos[1] - .2) / d[1], g = [cam.pos[0] + d[0] * t, cam.pos[2] + d[2] * t];
    if (lastG) { ptrG[2] = clamp(lerp(ptrG[2], (g[0] - lastG[0]) / dt * .25, .5), -2, 2); ptrG[3] = clamp(lerp(ptrG[3], (g[1] - lastG[1]) / dt * .25, .5), -2, 2); }
    ptrG[0] = g[0]; ptrG[1] = g[1]; lastG = g;
  }
  if (grabbed) grabT = grabTarget(grabbed);
  // no gyroscope: the mouse tilts the world, across for left and right, up and down for toward you
  if (!hasGyro && e.pointerType === 'mouse') {
    env.tiltTarget = ((e.clientX / W) - .5) * 2 * (16 * Math.PI / 180);
    env.leanTarget = ((e.clientY / H) - .5) * 2 * (10 * Math.PI / 180);
  }
  wake();
}
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerleave', () => { env.pointer.inside = false; lastG = null; if (!hasGyro) { env.tiltTarget = 0; env.leanTarget = 0; } });
cv.addEventListener('pointerdown', e => {
  onMove(e); env.pointer.down = true;
  const n = pick(e.clientX, e.clientY, 22);
  downAt = { x: e.clientX, y: e.clientY, t: performance.now(), n };
  if (n) { grabbed = n; grabT = grabTarget(n); cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing'); }
});
function endPointer(e) {
  env.pointer.down = false; cv.classList.remove('grabbing');
  if (downAt && downAt.n && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 8 && performance.now() - downAt.t < 350) {
    const n = downAt.n;      // a tap: flick it, turn it over, and let it ring
    n.yw += (Math.random() < .5 ? -1 : 1) * 8;
    n.Cp.px -= (Math.random() - .5) * .006; n.Cp.pz -= (Math.random() - .5) * .006; n.Cp.py += .002;
    ring(n, .7);
  }
  grabbed = null; downAt = null;
  if (e.pointerType !== 'mouse') { env.pointer.inside = false; lastG = null; }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

function updateHover() {
  const p = env.pointer, mouse = p.inside && p.type === 'mouse' && !grabbed;
  ptrG[2] *= .93; ptrG[3] *= .93;
  for (const n of PIECES) {
    // magnetic damping: near the cursor the air around a piece thickens and goes still, so it settles
    let target = 0;
    if (mouse && n.X != null) { const d = Math.hypot(p.sx - n.X, p.sy - n.Y), R = n.R + 60; if (d < R) target = Math.pow(1 - d / R, 1.5); }
    n.hover = lerp(n.hover, target, .12);
    n.Cp.resist = n.S.resist = 1 + n.hover * 40;
    n.Cp.still = n.S.still = n.hover;
  }
  const h = mouse ? pick(p.sx, p.sy, 10) : grabbed;
  if (h !== hovered) {
    if (h && !grabbed) { h.yw += (p.vx >= 0 ? 1 : -1) * 8.5; ring(h, .18); }   // hover turns it over
    hovered = h;
    cv.classList.toggle('grab', !!h);
  }
}

/* ───────────── Controls ───────────── */
const controls = document.getElementById('controls');
const bAir = document.getElementById('b-air'), bSound = document.getElementById('b-sound');
let idleT = 0;
function wake() { idleT = 0; controls.classList.remove('idle'); }
function paintAir() {
  bAir.querySelectorAll('.w').forEach((w, i) => w.classList.toggle('on', i < env.air));
  bAir.setAttribute('aria-label', `Air in the room: ${env.airLevels[env.air][0]}. Change it.`);
}
bAir.addEventListener('click', () => { env.air = (env.air + 1) % env.airLevels.length; paintAir(); wake(); });
bSound.addEventListener('click', async () => {
  if (!hasGyro) await askMotion();     // on a phone, the same tap asks to use its motion sensors
  Sound.toggle();
  bSound.classList.toggle('on', Sound.on); bSound.setAttribute('aria-pressed', String(Sound.on));
  bSound.setAttribute('aria-label', Sound.on ? 'Turn sound off' : 'Turn sound on');
  wake();
});
controls.addEventListener('pointerenter', wake);
paintAir();

/* ───────────── Run ───────────── */
let TALL = null;
function hang() {
  const tall = innerHeight / innerWidth > 1.25;
  if (tall === TALL) return;
  TALL = tall; grabbed = null; hovered = null;
  assemble(tall);
  const keep = env.air, t = env.t; env.air = 0;     // let it settle into balance before it is seen
  for (let i = 0; i < 600; i++) step(1 / 60);
  env.air = keep; env.t = t;
  REST = bounds();
}
if (gl) { initGL(); initObjects(); } else cv.style.background = 'linear-gradient(#9DB8D6, #E2E9DE 30%, #7F9B5B 34%, #4D7752)';
hang(); if (gl) resize();
addEventListener('resize', () => { hang(); if (gl) resize(); });

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; frameDt = dt || 1 / 60;
  // a LERP of 0.05 per frame takes the jitter out of the sensor (or the mouse)
  env.tilt = lerp(env.tilt, env.tiltTarget, .05);
  env.lean = lerp(env.lean, env.leanTarget, .05);
  env.ix *= .9; env.iy *= .9; env.iz *= .9;
  env.pointer.vx *= .92; env.pointer.vy *= .92;
  updateHover();
  acc += dt;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; }
  if (gl) render();
  Sound.air(env.airNow * 2, env.gust);
  idleT += dt; if (idleT > 4) controls.classList.add('idle');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__mobile = { env, PIECES, RODS, step };
})();
</script>
