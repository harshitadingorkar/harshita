<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Generative Power of Props — Harshita Shyale</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono&family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
:root{--ground:#F2EFE7;--ink:#191915;--ink2:rgba(25,25,21,.56);--ink3:rgba(25,25,21,.3);--hair:rgba(25,25,21,.14);--ox:#6B2A2F;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font:400 19px/1.62 'Newsreader',Georgia,serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
::selection{background:var(--ox);color:var(--ground)}
a{color:inherit}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:multiply;z-index:9}
.run{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 28px;font:11px 'Geist Mono',monospace;color:var(--ink2);z-index:5;background:linear-gradient(var(--ground) 60%,transparent)}
.run a{text-decoration:none;transition:color .16s}.run a:hover{color:var(--ox)}
.progress{position:fixed;left:0;top:0;height:1px;background:var(--ox);width:0;z-index:6}
.book{max-width:1120px;margin:0 auto;padding:0 28px}
.title-page{min-height:100vh;display:grid;place-content:center;text-align:center;padding:120px 0 80px}
.title-page .front{font:11px 'Geist Mono',monospace;color:var(--ink2);margin-bottom:56px}
.title-page h1{font:400 clamp(48px,7vw,92px)/.95 'Instrument Serif',serif;letter-spacing:-.015em;max-width:12ch;margin:0 auto}
.title-page h2{font:italic 300 22px/1.35 'Newsreader',serif;color:var(--ink2);margin:26px auto 0;max-width:30ch}
.title-page .by{margin-top:60px;font:13px 'Instrument Sans',sans-serif;letter-spacing:.02em}
.title-page .orn{margin:40px auto 0;width:42px;color:var(--ink)}
.epigraph{max-width:560px;margin:0 auto 120px;font:italic 300 20px/1.5 'Newsreader',serif;color:var(--ink2);text-align:center}
.chapter{display:grid;grid-template-columns:1fr minmax(0,620px) 1fr;column-gap:56px;margin-bottom:120px}
.chapter>*{grid-column:2}
.chapter h3{font:400 13px 'Geist Mono',monospace;color:var(--ox);letter-spacing:.02em;margin-bottom:10px}
.chapter h3 + .ct{font:400 44px/1.04 'Instrument Serif',serif;letter-spacing:-.01em;margin-bottom:42px}
.chapter p{margin-bottom:0;text-indent:1.6em;hyphens:auto;text-wrap:pretty}
.chapter .ct + p,.chapter p.first{text-indent:0}
.chapter .ct + p::first-letter{float:left;font:400 88px/.78 'Instrument Serif',serif;padding:8px 10px 0 0;color:var(--ox)}
.chapter blockquote{margin:28px 0;padding-left:22px;box-shadow:inset 1px 0 0 var(--ox);font-style:italic;color:var(--ink2)}
.fn{font:10px 'Geist Mono',monospace;color:var(--ox);vertical-align:super;text-decoration:none;margin-left:1px}
.side{grid-column:3;grid-row:auto;font:12px/1.5 'Instrument Sans',sans-serif;color:var(--ink2);align-self:start;position:relative}
.folio{grid-column:2;text-align:center;font:11px 'Geist Mono',monospace;color:var(--ink3);margin-top:56px}
.notes{max-width:620px;margin:0 auto 160px;font:14px/1.55 'Newsreader',serif;color:var(--ink2)}
.notes h4{font:11px 'Geist Mono',monospace;color:var(--ox);font-weight:400;margin-bottom:16px}
.notes li{margin:0 0 10px 1.2em}
.end{text-align:center;font:italic 22px 'Instrument Serif',serif;margin:0 0 140px}
.end a{text-decoration:none;border-bottom:1px solid currentColor}
.rv{opacity:0;transform:translateY(10px);transition:opacity .8s var(--e),transform 1s var(--e)}
.rv.in{opacity:1;transform:none}
@media(max-width:900px){.chapter{grid-template-columns:1fr;column-gap:0}.chapter>*,.side,.folio{grid-column:1}.side{margin:14px 0}body{font-size:18px}.chapter h3 + .ct{font-size:36px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="grain"></div><div class="progress" id="progress"></div>
<div class="run"><a href="./">← harshita shyale</a><span id="runhead">the generative power of props</span><span id="pg">i</span></div>
<main class="book" id="book"></main>
<script>
(async () => {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/_(.+?)_/g,'<i>$1</i>').replace(/\[\^(\d+)\]/g,'<a class="fn" href="#n$1" id="r$1">$1</a>');
  const md = await (await fetch('data/paper.md')).text();
  const lines = md.split(/\n/); let front = '', title = '', sub = '', epi = '', chapters = [], notes = [], cur = null, para = [];
  const flush = () => { if (para.length && cur) cur.body.push(para.join(' ')); para = []; };
  for (const L of lines) {
    let m;
    if ((m = L.match(/^\[\^(\d+)\]:\s*(.*)/))) { flush(); notes.push([m[1], m[2]]); continue; }
    if (L.startsWith('# ')) { title = L.slice(2); continue; }
    if (L.startsWith('## ')) { sub = L.slice(3); continue; }
    if (L.startsWith('### ')) { flush(); const t = L.slice(4); const [k, ...r] = t.split(':'); cur = { k: r.length ? k.trim() : '', t: (r.length ? r.join(':') : t).trim(), body: [] }; chapters.push(cur); continue; }
    if (L.startsWith('> ')) { if (!cur) { epi += L.slice(2) + ' '; continue; } flush(); cur.body.push('>' + L.slice(2)); continue; }
    if (!L.trim()) { flush(); continue; }
    if (!title) { front += L; continue; }
    para.push(L.trim());
  }
  flush();
  const roman = n => ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii'][n] || n;
  let html = `<section class="title-page"><p class="front">${esc(front)}</p><h1>${inline(title)}</h1><h2>${inline(sub)}</h2><svg class="orn" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${[0,60,120,180,240,300].map(r=>`<path transform="rotate(${r} 50 50)" d="M50 50 C 44 36, 40 22, 50 14 C 60 22, 56 36, 50 50"/>`).join('')}</g></svg><p class="by">Harshita Shyale</p></section>`;
  if (epi) html += `<blockquote class="epigraph rv">${inline(epi.trim())}</blockquote>`;
  chapters.forEach((c, i) => {
    html += `<section class="chapter" data-k="${esc(c.t.toLowerCase())}" data-pg="${roman(i + 1)}"><h3 class="rv">${esc(c.k || 'Scene ' + (i + 1))}</h3><div class="ct rv">${inline(c.t)}</div>`;
    c.body.forEach(p => { html += p.startsWith('>') ? `<blockquote class="rv">${inline(p.slice(1))}</blockquote>` : `<p class="rv">${inline(p)}</p>`; });
    html += `<p class="folio">— ${roman(i + 1)} —</p></section>`;
  });
  if (notes.length) html += `<section class="notes rv"><h4>notes</h4><ol>${notes.map(([n, t]) => `<li id="n${n}">${inline(t)} <a class="fn" href="#r${n}">↩</a></li>`).join('')}</ol></section>`;
  html += `<p class="end rv"><a href="./">close the book</a></p>`;
  document.getElementById('book').innerHTML = html;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.rv').forEach(el => io.observe(el));
  const rh = document.getElementById('runhead'), pg = document.getElementById('pg'), pr = document.getElementById('progress');
  const chs = [...document.querySelectorAll('.chapter')];
  addEventListener('scroll', () => { const y = scrollY + innerHeight * .35; let c = null; chs.forEach(s => { if (s.offsetTop < y) c = s; }); rh.textContent = c ? c.dataset.k : 'the generative power of props'; pg.textContent = c ? c.dataset.pg : 'i'; pr.style.width = (scrollY / (document.documentElement.scrollHeight - innerHeight) * 100) + '%'; }, { passive: true });
  const cv = document.createElement('canvas'); cv.width = cv.height = 180; const x = cv.getContext('2d'), d = x.createImageData(180, 180); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255 | 0; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; } x.putImageData(d, 0, 0); document.getElementById('grain').style.background = `url(${cv.toDataURL()})`;
})();
</script>
</body>
</html>
